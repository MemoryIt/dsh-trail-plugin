# dsh-trail-plugin 的挂载示例（骨架阶段仅供演示与结构校验）。
#
# DSH 的组合是 Cordis：每个能力是一行 `- id: <行id> / name: <包名>`。
#
# 挂载方式（选定功能后再按部署方式落地）：
# 1) 补丁覆盖层：`dsh web --patch cordis.yml`（或对应 CLI 的 patch 参数），
#    本文件与 web profile 同级应用，逐行插入/覆盖组合；
# 2) agent preset：把下面这行复制进 preset 的 `agent.cordis.yml`，
#    并将包安装到该 preset 能解析的依赖里（发布到 npm 或本地 link）。
#
# 注意：
# - `name` 必须是运行时能解析到的模块名（默认入口 = host 半区）；
# - client 半区不单独声明行：包内 `exports["./client"]` + package.json 的
#   `dsh.client` 声明（platform: web）即可被 client-modules 扫描进浏览器
#   roster，详见 packages/client/modules 与 packages/bundle/web-app 的 ui-* 行。

- id: dsh-trail-plugin
  name: '@deepseek-ai/dsh-trail-plugin'
  config:
    enabled: true
    label: dsh-trail
